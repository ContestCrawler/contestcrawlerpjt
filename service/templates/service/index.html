{% extends "base.html" %}

{% block content %}

<h1>공모전 목록</h1>

<hr>

<form action="{% url "service:index" %}" method="GET">
    <select name="institution" id="institution">
        <option value="">기관 선택</option>
        {% for institution in institutions %}
        <option value={{ institution }}>{{ institution }}</option>
        {% endfor %}
    </select>

    <select name="region_name" id="region">
        <option value="">지역 선택</option>
        {% for region in regions %}
        <option value={{ region }}>{{ region }}</option>
        {% endfor %}
    </select>

    <select name="category" id="category">
        <option value="">분야 선택</option>
        {% for category in categories %}
        <option value={{ category }}>{{ category }}</option>
        {% endfor %}
    </select>

    <input type="text" name="search_word" id="title__lookup"
            placeholder='검색어를 입력하세요'>
    <input type="submit" value="검색">
</form>

<hr>

{% for contest in contests %}
    <p><a href={{ contest.detail_url }}>{{ contest.title }}</a></p>
    <a href="{% url "service:detail" contest.pk %}">[상세 페이지]</a>
    <p>{{ contest.start_date }} - {{ contest.end_date }}</p>
    <hr>
{% endfor %}


최종 업데이트 날짜:
{% endblock content %}
